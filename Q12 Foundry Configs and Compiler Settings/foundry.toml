[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
solc_version = "0.8.29"
optimizer = true
optimizer_runs = 200

[profile.optimized]
optimizer = true
optimizer_runs = 10000

[profile.no_optimizer]
optimizer = false